[workspace]
members = [
    "crates/slice-core",
    "crates/slice-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gio Della-Libera"]
license = "MIT"
repository = "https://github.com/giodl73-repo/SLICE"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"
